publications:
  - id: "shaderagent"
    date: 2026-09-24
    title: "ShaderAgent: Self-Evolving Agentic Procedural Material Generation"
    cover_label: "ShaderAgent"
    cover_tone: "gold"
    authors:
      - { name: "Ze Yuan", self: true }
      - { name: "Chia-hao Chen" }
      - { name: "Yuqing Zhang" }
      - { name: "Yan-Pei Cao" }
      - { name: "Ding Liang" }
      - { name: "Xiaojuan Qi" }
    venue: "SIGGRAPH Asia 2026"
    track: "Conference Track"
    highlights:
      - { label: "First Author", tone: "green" }
    summary: "ShaderAgent turns a reference photo into an editable Blender procedural material: a node graph you can open and tweak, not a baked texture. A Designer LLM writes a shader-graph DSL, Cycles renders it, and a fine-tuned VLM scorer drives numeric parameter search."
    image: "media/publications/shaderagent.jpg"
    image_alt: "Procedural materials generated by ShaderAgent, showing translucency, emission and other shader-level effects on reference objects"
    preview_image: "media/publications/shaderagent-preview.webp"
    links:
      - { label: "Paper", url: "https://github.com/VAST-AI-Research/ShaderAgent/releases/latest/download/ShaderAgent.pdf" }
      - { label: "Project", url: "https://github.com/VAST-AI-Research/ShaderAgent" }
      - { label: "DOI", url: "https://doi.org/10.1145/3829340.3842164" }

  - id: "seqtex"
    date: 2025-12-03
    title: "SeqTex: Generate Mesh Textures in Video Sequence"
    cover_label: "SeqTex"
    cover_tone: "blue"
    authors:
      - { name: "Ze Yuan", self: true }
      - { name: "Xin Yu" }
      - { name: "Yangtian Sun" }
      - { name: "Yuan-Chen Guo" }
      - { name: "Yan-Pei Cao" }
      - { name: "Ding Liang" }
      - { name: "Xiaojuan Qi" }
    venue: "SIGGRAPH Asia 2025"
    track: "Conference Track"
    highlights:
      - { label: "First Author", tone: "green" }
    summary: "SeqTex formulates mesh texture generation as a sequence generation problem and leverages video diffusion priors for coherent texture synthesis."
    image: "media/publications/seqtex.jpg"
    image_alt: "A gallery of colorful textured 3D assets generated by SeqTex"
    preview_image: "media/publications/seqtex-preview.webp"
    links:
      - { label: "Paper", url: "https://arxiv.org/pdf/2507.04285" }
      - { label: "Project", url: "https://yuanze1024.github.io/SeqTex/" }
      - { label: "DOI", url: "https://doi.org/10.1145/3757377.3763863" }

